name: Publish Docker image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=tag

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Portainer image tag
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -e

          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          SHORT_SHA="${GITHUB_SHA::7}"
          TAG="sha-${SHORT_SHA}"
          FULL_IMAGE="${IMAGE}:${TAG}"

          echo "Updating Portainer image to:"
          echo "${FULL_IMAGE}"

          if [ ! -f "docker-compose.portainer.yml" ]; then
            echo "docker-compose.portainer.yml not found"
            exit 1
          fi

          sed -i -E \
            "s|^([[:space:]]*image:[[:space:]]*)ghcr\.io/[^[:space:]]+|\1${FULL_IMAGE}|" \
            docker-compose.portainer.yml

          echo "Updated compose file:"
          cat docker-compose.portainer.yml

      - name: Commit Portainer deployment
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -e

          if git diff --quiet -- docker-compose.portainer.yml; then
            echo "No changes to docker-compose.portainer.yml"
            exit 0
          fi

          SHORT_SHA="${GITHUB_SHA::7}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docker-compose.portainer.yml
          git commit -m "chore: deploy sha-${SHORT_SHA}"
          git push origin HEAD:main
